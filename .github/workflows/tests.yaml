name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GGSEGDEMO_FULL_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
          extra-repositories: https://ggsegverse.r-universe.dev

      # Only the packages that genuinely come from CRAN. The ggsegverse ones
      # are installed below, because pak resolves them to their CRAN releases,
      # and the atlas packages need the development ggseg.formats.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::withr
            any::shiny
            any::bslib
            any::bsicons
            any::DT
            any::ggplot2
            any::sass
            any::yaml

      - name: Install ggsegverse packages
        run: |
          # r-universe first: the atlas packages depend on development
          # versions of ggseg.formats that the CRAN releases do not satisfy.
          repos <- c(
            ggsegverse = "https://ggsegverse.r-universe.dev",
            getOption("repos")
          )
          core <- c("ggseg.formats", "ggseg", "ggseg3d", "ggseg.meshes")
          atlases <- unique(readRDS("data/atlas_registry.rds")$package)
          pkgs <- unique(c(core, atlases))

          install.packages(pkgs, repos = repos)

          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing)) {
            stop("failed to install: ", toString(missing))
          }

          # A CRAN ggseg.formats here would break every atlas package at load
          # time, so fail now with a clear message rather than deep in a test.
          formats <- packageVersion("ggseg.formats")
          if (formats < "0.0.4.9004") {
            stop(
              "ggseg.formats ", formats, " came from CRAN; ",
              "the atlas packages need the r-universe development version"
            )
          }
        shell: Rscript {0}

      - name: Run tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
